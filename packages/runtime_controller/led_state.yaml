# Optional led_state policy bindings.
runtime_controller:
  policies:
    led_status:
      output: g_applied_led
      values:
        idle: 0
        muted: 1
        mic_muted: 2
        speaker_muted: 3
        wake: 4
        listening: 5
        thinking: 6
        responding: 7
        voip_ringing: 8
        voip_calling: 9
        voip_in_call: 10
        error: 11
        media: 12
        boot: 13
        no_wifi: 14
        no_ha: 15
        no_va: 16
        timer_ringing: 17
        voip_remote_ringing: 18
